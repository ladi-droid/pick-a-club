# Save this at: .github/workflows/update-data.yml
#
# Refreshes data.json twice a day and republishes the site.
# Nothing to run by hand — once this is committed and Pages is
# switched to "GitHub Actions", the page maintains itself.

name: Refresh league data

on:
  schedule:
    # 06:00 and 18:00 UTC = 10:00 and 22:00 Gulf time.
    # The later run catches tickets released after a matchweek ends.
    - cron: "0 6,18 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch standings and tickets
        run: node update-data.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No change since last run."
          else
            git add data.json
            git commit -m "Refresh league data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
